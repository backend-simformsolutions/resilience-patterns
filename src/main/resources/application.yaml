server:
  port: 8080

spring:
  application:
    name: resilience-patterns-poc

# ──────────────────────────────────────────────
# Resilience4j Configuration
# ──────────────────────────────────────────────
resilience4j:

  # ── Retry Configuration ──
  retry:
    instances:
      paymentService:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - com.simform.resilience.exception.ServiceUnavailableException
          - java.io.IOException
        ignore-exceptions:
          - com.simform.resilience.exception.BusinessValidationException

      inventoryService:
        max-attempts: 4
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.simform.resilience.exception.ServiceUnavailableException

  # ── Circuit Breaker Configuration ──
  circuitbreaker:
    instances:
      paymentService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.simform.resilience.exception.ServiceUnavailableException
          - java.io.IOException
        ignore-exceptions:
          - com.simform.resilience.exception.BusinessValidationException

      inventoryService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.simform.resilience.exception.ServiceUnavailableException

  # ── TimeLimiter (Timeout) Configuration ──
  timelimiter:
    instances:
      paymentService:
        timeout-duration: 3s
        cancel-running-future: true

      inventoryService:
        timeout-duration: 2s
        cancel-running-future: true

# ── Actuator / Management ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries,metrics
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# ── Logging ──
logging:
  level:
    com.simform.resilience: DEBUG
    io.github.resilience4j: DEBUG
